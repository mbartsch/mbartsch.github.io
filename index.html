<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marcelo Bartsch</title>
<meta name="description" content="Marcelo Bartsch: profile and contact.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Same palette as the Klotse guide: slate neutrals with a teal accent. Plain HTML and CSS, no scripts. */
:root{--bg:#f5f7f8;--panel:#ffffff;--ink:#1c2327;--mute:#56616a;--accent:#0f6e6c;--line:#d8dee3;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#12171a;--panel:#1a2125;--ink:#e4e9ec;--mute:#9aa7b0;--accent:#41b8b4;--line:#33404a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:16px/1.6 "JetBrains Mono",ui-monospace,Consolas,Menlo,monospace}
main{max-width:560px;width:100%}
h1{font-size:clamp(24px,4vw,32px);margin:0 0 8px;color:var(--accent)}
p{margin:0 0 20px;color:var(--mute)}
.links{display:flex;flex-wrap:wrap;gap:12px}
a.link{display:inline-block;padding:10px 16px;border:1px solid var(--accent);border-radius:6px;color:var(--accent);text-decoration:none;font-weight:500}
a.link:hover,a.link:focus-visible{background:var(--accent);color:var(--bg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>Marcelo Bartsch</h1>
  <p>Find me on LinkedIn.</p>
  <div class="links">
    <a class="link" href="https://www.linkedin.com/in/marcelobartsch" rel="me noopener">LinkedIn profile</a>
    <a class="link" href="https://github.com/mbartsch/klotse" rel="noopener">Klotse project</a>
  </div>
</main>
</body>
</html>
